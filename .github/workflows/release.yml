name: Publicar actualización

# Cada push a master que toque la app compila el APK release (solo ARM64) y lo
# publica en el release fijo `latest` junto a un version.json; la app instalada
# lo consulta y ofrece actualizarse. Requiere repo publico (la app descarga sin
# credenciales).
#
# Secreto (Settings > Secrets and variables > Actions):
#   ANDROID_DEBUG_KEYSTORE_B64  ~/.android/debug.keystore en base64. El build
#       release se firma con esa clave (android/app/build.gradle.kts); sin la
#       misma firma que el APK instalado Android rechaza la actualizacion.
#       Generar: base64 -w0 ~/.android/debug.keystore

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# Un despliegue a la vez; si llegan varios commits seguidos, gana el mas reciente.
concurrency:
  group: publicar-actualizacion
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el numero de compilacion sale del numero de commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Restaurar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Falta el secreto ANDROID_DEBUG_KEYSTORE_B64"; exit 1; }
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Compilar
        working-directory: apps/mobile_flutter
        run: |
          # Misma formula que tool/deploy.sh.
          BUILD=$(git rev-list --count HEAD)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          flutter pub get
          flutter build apk --release \
            --build-number="$BUILD" --target-platform android-arm64

      - name: Preparar el sitio
        run: |
          mkdir site
          cp apps/mobile_flutter/build/app/outputs/flutter-apk/app-release.apk site/PrivateSandbox.apk
          NAME=$(sed -n 's/^version: *\([0-9A-Za-z.-]*\)+.*/\1/p' apps/mobile_flutter/pubspec.yaml)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "No se encontró apksigner"; exit 1; }
          CERTIFICATE_SHA256=$($APKSIGNER verify --print-certs site/PrivateSandbox.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$CERTIFICATE_SHA256" || { echo "No se pudo leer el certificado del APK"; exit 1; }
          jq -n \
            --argjson build "$BUILD" \
            --arg name "$NAME" \
            --arg message "$(git log -1 --format=%s)" \
            --argjson bytes "$(stat -c %s site/PrivateSandbox.apk)" \
            --arg certificateSha256 "$CERTIFICATE_SHA256" \
            '{build:$build, name:$name, message:$message, apk:"PrivateSandbox.apk", bytes:$bytes, certificateSha256:$certificateSha256}' \
            > site/version.json
          cat site/version.json

      - name: Publicar en el release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Última versión" \
            --notes "Publicado automáticamente por CI; la app lo consulta."
          # Primero el APK y despues el manifiesto: la app nunca ve un
          # version.json que apunte a un APK aun inexistente.
          gh release upload latest site/PrivateSandbox.apk --clobber
          gh release upload latest site/version.json --clobber
